<html lang="es">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Admin — Porra Champions League 2026/27</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2129; --border:#2a313c;
    --orange:#ff8a3d; --orange2:#ffb35c; --text:#e6edf3; --muted:#8b949e;
    --green:#3fb950; --red:#f85149; --gold:#ffd166;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);padding-bottom:70px;}
  header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#12161d,#0d1117);border-bottom:1px solid var(--border);padding:14px 16px 10px;}
  header h1{margin:0;font-size:1.05rem;display:flex;align-items:center;gap:8px;}
  header h1 .logo{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,var(--orange),var(--orange2));display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#1a1200;font-size:.8rem;flex-shrink:0;}
  header .sub{color:var(--muted);font-size:.75rem;margin-top:2px;}
  .warn{background:rgba(248,81,73,.12);border:1px solid rgba(248,81,73,.35);color:#ffb4af;border-radius:10px;padding:8px 12px;font-size:.75rem;margin-top:8px;}
  nav{display:flex;gap:6px;position:sticky;top:70px;z-index:19;background:var(--bg);padding:8px 10px;border-bottom:1px solid var(--border);overflow-x:auto;}
  nav button{flex:1;white-space:nowrap;background:transparent;border:1px solid var(--border);color:var(--muted);padding:9px 10px;border-radius:10px;font-size:.82rem;font-weight:600;cursor:pointer;}
  nav button.active{background:var(--orange);color:#1a1200;border-color:var(--orange);}
  main{padding:14px;max-width:760px;margin:0 auto;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;}
  .muted{color:var(--muted);}
  h2{font-size:1rem;margin:0 0 10px;color:var(--orange2);}
  h3{font-size:.88rem;margin:16px 0 8px;color:var(--text);border-top:1px solid var(--border);padding-top:12px;}
  select,input[type=text],input[type=number]{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-size:.9rem;width:100%;}
  .btn{background:var(--orange);color:#1a1200;border:none;border-radius:10px;padding:11px 16px;font-weight:700;font-size:.9rem;cursor:pointer;}
  .btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border);}
  .btn:disabled{opacity:.5;}
  .jornada-title{font-weight:700;margin:14px 0 8px;color:var(--orange2);font-size:.9rem;}
  .match-row{display:grid;grid-template-columns:1fr 46px 46px 1fr;gap:6px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--border);font-size:.85rem;}
  .match-row input{width:100%;text-align:center;padding:6px 2px;}
  .match-row .team{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .match-row .team.home{text-align:right;}
  .match-meta{font-size:.78rem;color:var(--muted);margin:10px 0 4px;}
  .top8-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .team-chip{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:.83rem;cursor:pointer;}
  .team-chip input{width:auto;}
  .team-chip.checked{border-color:var(--orange);background:rgba(255,138,61,.1);}
  .counter{font-size:.78rem;color:var(--muted);margin-top:6px;}
  label.field-label{font-size:.78rem;color:var(--muted);margin-bottom:4px;display:block;}
  .bonus-grid{display:grid;grid-template-columns:1fr;gap:10px;}
  .ko-tie{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:10px;}
  .ko-tie .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px;}
  .ko-tie .unlock-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:.85rem;}
  .save-bar{position:fixed;left:0;right:0;bottom:0;background:#12161d;border-top:1px solid var(--border);padding:10px 14px;display:flex;gap:10px;justify-content:center;z-index:30;}
  .save-bar .btn{flex:1;max-width:420px;}
  .toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:var(--green);color:#06210b;padding:9px 16px;border-radius:10px;font-weight:700;font-size:.85rem;z-index:40;opacity:0;transition:opacity .3s;pointer-events:none;}
  .toast.show{opacity:1;}
  .toast.err{background:var(--red);color:#3a0a08;}
  .empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:.9rem;}
</style>
</head>

<header>
  <h1><span class="logo">UCL</span> Admin — Porra Champions 2026/27</h1>

];

/* ============ ESTRUCTURA DE ELIMINATORIAS (esqueleto por defecto) ============ */
function defaultKo(){
  const stages = [['Playoff',8,'PO'],['Octavos',8,'R16'],['Cuartos',4,'QF'],['Semifinales',2,'SF']];
  const ko = [];
  stages.forEach(s=>{
    for(let i=1;i<=s[1];i++) ko.push({id:s[2]+i, stage:s[0], tie:i, home:'', away:'', unlocked:false});
  });
  ko.push({id:'FINAL', stage:'Final', tie:1, home:'', away:'', unlocked:false});
  return ko;
}
function koLegIds(tieId){
  if(tieId==='FINAL') return [{id:'FINAL', label:'Final única'}];
  return [{id:tieId+'_ida', label:'Ida'}, {id:tieId+'_vuelta', label:'Vuelta'}];
}
function defaultResults(){
  return {matches:{}, top8Actual:[], champion:'', runnerUp:'', leagueLeader:'', scorer:'', ko:{}, jornadaAbierta:2};
}

/* ============ ESTADO ============ */
let RESULTS = defaultResults();
let KO = defaultKo();
let PARTICIPANTS = [];

/* ============ API ============ */
async function apiCall(action, payload){
  try{
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action, payload})
    });
    return await res.json();
  }catch(e){
    console.error(e);
    return {ok:false, error:String(e)};
  }
}

async function loadAll(){
  const data = await apiCall('getAll', {});
  if(data && data.ok){
    PARTICIPANTS = data.participants || [];
    RESULTS = Object.assign(defaultResults(), data.results||{});
    KO = (data.ko && data.ko.length) ? data.ko : defaultKo();
  }
  document.getElementById('headerSub').textContent =
    `${PARTICIPANTS.length} participantes cargados · ${Object.keys(RESULTS.matches||{}).length} / 144 resultados de liga registrados · Jornadas abiertas: 1–${RESULTS.jornadaAbierta==null?2:RESULTS.jornadaAbierta}`;
}

async function saveAll(){
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'Guardando...';
  const r1 = await apiCall('saveResults', RESULTS);
  const r2 = await apiCall('saveKo', KO);
  btn.disabled = false; btn.textContent = 'Guardar cambios';
  if(r1 && r1.ok && r2 && r2.ok){
    showToast('Cambios guardados ✔');
    document.getElementById('headerSub').textContent =
      `${PARTICIPANTS.length} participantes cargados · ${Object.keys(RESULTS.matches||{}).length} / 144 resultados de liga registrados`;
  } else {
    showToast('Error al guardar — revisa la conexión', true);
  }
}
document.getElementById('saveBtn').addEventListener('click', saveAll);

/* ============ NAVEGACIÓN DE TABS ============ */
document.querySelectorAll('nav button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('main section').forEach(s=>s.style.display='none');
    document.getElementById('tab-'+btn.dataset.tab).style.display='block';
    renderTab(btn.dataset.tab);
  });
});
function renderTab(tab){
  if(tab==='liga') renderLiga();
  if(tab==='clasif') renderClasif();
  if(tab==='bonus') renderBonus();
  if(tab==='ko') renderKo();
}

/* ============ FASE DE LIGA ============ */
function renderLiga(){
  const el = document.getElementById('tab-liga');
  if(RESULTS.jornadaAbierta==null) RESULTS.jornadaAbierta = 2;
  let html = `<div class="card"><h2>Apertura de jornadas</h2>
    <p class="muted" style="font-size:.8rem">Los participantes solo pueden rellenar hasta esta jornada (y los bonus finales/Top 8). Cuando terminéis una tanda, sube el número para abrir las siguientes.</p>
    <label class="field-label">Jornadas abiertas para rellenar</label>
    <select id="jornadaAbiertaSel">`;
  for(let j=1;j<=8;j++){
    html += `<option value="${j}" ${RESULTS.jornadaAbierta===j?'selected':''}>Hasta la Jornada ${j}</option>`;
  }
  html += `</select></div>`;
  html += '<div class="card"><h2>Resultados — fase de liga (144 partidos)</h2><p class="muted" style="font-size:.8rem">Deja un partido en blanco si todavía no se ha jugado. Pulsa "Guardar cambios" abajo cuando termines.</p>';
  for(let j=1;j<=8;j++){
    html += `<div class="jornada-title">Jornada ${j}</div>`;
    MATCHES.filter(m=>m.j===j).forEach(m=>{
      const r = RESULTS.matches[m.id] || {};
      html += `<div class="match-row">
        <div class="team home">${escapeHtml(m.h)}</div>
        <input type="number" min="0" max="20" data-mid="${m.id}" data-side="h" value="${r.h!=null?r.h:''}">
        <input type="number" min="0" max="20" data-mid="${m.id}" data-side="a" value="${r.a!=null?r.a:''}">
        <div class="team">${escapeHtml(m.a)}</div>
      </div>`;
    });
  }
  html += '</div>';
  el.innerHTML = html;
  document.getElementById('jornadaAbiertaSel').addEventListener('change', e=>{
    RESULTS.jornadaAbierta = Number(e.target.value);
  });
  el.querySelectorAll('input[type=number]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const mid = inp.dataset.mid;
      RESULTS.matches[mid] = RESULTS.matches[mid] || {};
      if(inp.value===''){
        delete RESULTS.matches[mid][inp.dataset.side];
        if(RESULTS.matches[mid].h===undefined && RESULTS.matches[mid].a===undefined) delete RESULTS.matches[mid];
      } else {
        RESULTS.matches[mid][inp.dataset.side] = inp.value;
      }
    });
  });
}

/* ============ CLASIFICACIÓN FINAL (TOP 8 REAL) ============ */
function renderClasif(){
  const el = document.getElementById('tab-clasif');
  let html = `<div class="card"><h2>Clasificación final — Top 8 real</h2>
    <p class="muted" style="font-size:.8rem">Marca los 8 equipos que terminaron 1º-8º en la fase de liga (pase directo a octavos). Rellénalo cuando acabe la jornada 8.</p>
    <div class="top8-grid" id="top8Grid">`;
  TEAMS.forEach(t=>{
    const checked = RESULTS.top8Actual && RESULTS.top8Actual.includes(t);
    html += `<label class="team-chip ${checked?'checked':''}"><input type="checkbox" value="${escapeHtml(t)}" ${checked?'checked':''}> ${escapeHtml(t)}</label>`;
  });
  html += `</div><div class="counter" id="top8Counter"></div></div>`;
  el.innerHTML = html;
  el.querySelectorAll('.team-chip input').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      RESULTS.top8Actual = RESULTS.top8Actual || [];
      if(cb.checked){
        if(RESULTS.top8Actual.length>=8){ cb.checked=false; showToast('Máximo 8 equipos', true); return; }
        RESULTS.top8Actual.push(cb.value);
      } else {
        RESULTS.top8Actual = RESULTS.top8Actual.filter(t=>t!==cb.value);
      }
      cb.closest('.team-chip').classList.toggle('checked', cb.checked);
      updateTop8Counter();
    });
  });
  updateTop8Counter();
}
function updateTop8Counter(){
  const c = document.getElementById('top8Counter');
  if(c) c.textContent = `${(RESULTS.top8Actual||[]).length} / 8 seleccionados`;
}

/* ============ BONUS FINALES REALES ============ */
function teamSelect(id, value){
  let html = `<select id="${id}"><option value="">-- elegir equipo --</option>`;
  TEAMS.forEach(t=>{ html += `<option value="${escapeHtml(t)}" ${t===value?'selected':''}>${escapeHtml(t)}</option>`; });
  html += '</select>';
  return html;
}
function renderBonus(){
  const el = document.getElementById('tab-bonus');
  let html = `<div class="card"><h2>Bonus finales — resultado real</h2><div class="bonus-grid">
    <div><label class="field-label">🏆 Campeón</label>${teamSelect('rChampion', RESULTS.champion)}</div>
    <div><label class="field-label">🥈 Subcampeón</label>${teamSelect('rRunnerUp', RESULTS.runnerUp)}</div>
    <div><label class="field-label">📊 Equipo 1º de la fase de liga</label>${teamSelect('rLeader', RESULTS.leagueLeader)}</div>
    <div><label class="field-label">⚽ Máximo goleador real (nombre)</label><input type="text" id="rScorer" value="${escapeHtml(RESULTS.scorer||'')}" placeholder="Ej: Mbappe"></div>
  </div></div>`;
  el.innerHTML = html;
  document.getElementById('rChampion').addEventListener('change', e=>RESULTS.champion=e.target.value);
  document.getElementById('rRunnerUp').addEventListener('change', e=>RESULTS.runnerUp=e.target.value);
  document.getElementById('rLeader').addEventListener('change', e=>RESULTS.leagueLeader=e.target.value);
  document.getElementById('rScorer').addEventListener('input', e=>RESULTS.scorer=e.target.value);
}

/* ============ ELIMINATORIAS ============ */
function renderKo(){
  const el = document.getElementById('tab-ko');
  const stages = ['Playoff','Octavos','Cuartos','Semifinales','Final'];
  let html = '<div class="card"><h2>Eliminatorias</h2><p class="muted" style="font-size:.8rem">Desbloquea cada eliminatoria en cuanto se conozca el cruce (equipos), y añade los marcadores según se jueguen los partidos.</p>';
  stages.forEach(stage=>{
    const ties = KO.filter(k=>k.stage===stage);
    html += `<h3>${stage}</h3>`;
    ties.forEach(tie=>{
      html += `<div class="ko-tie" data-tieid="${tie.id}">
        <div class="unlock-row"><input type="checkbox" data-role="unlocked" ${tie.unlocked?'checked':''}> Eliminatoria desbloqueada (cruce conocido)</div>
        <div class="row2">
          <div><label class="field-label">Local</label>${teamSelect(tie.id+'_home', tie.home)}</div>
          <div><label class="field-label">Visitante</label>${teamSelect(tie.id+'_away', tie.away)}</div>
        </div>`;
      koLegIds(tie.id).forEach(leg=>{
        const r = RESULTS.ko[leg.id] || {};
        html += `<div class="match-row">
          <div class="team home">Local</div>
          <input type="number" min="0" max="20" data-legid="${leg.id}" data-side="h" value="${r.h!=null?r.h:''}">
          <input type="number" min="0" max="20" data-legid="${leg.id}" data-side="a" value="${r.a!=null?r.a:''}">
          <div class="team">Visitante <span class="muted">(${leg.label})</span></div>
        </div>`;
      });
      html += `</div>`;
    });
  });
  html += '</div>';
  el.innerHTML = html;

  el.querySelectorAll('.ko-tie').forEach(tieEl=>{
    const tieId = tieEl.dataset.tieid;
    const tie = KO.find(k=>k.id===tieId);
    tieEl.querySelector('[data-role="unlocked"]').addEventListener('change', e=>{ tie.unlocked = e.target.checked; });
    tieEl.querySelector(`#${tieId}_home`).addEventListener('change', e=>{ tie.home = e.target.value; });
    tieEl.querySelector(`#${tieId}_away`).addEventListener('change', e=>{ tie.away = e.target.value; });
  });
  el.querySelectorAll('input[type=number]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const legId = inp.dataset.legid;
      RESULTS.ko[legId] = RESULTS.ko[legId] || {};
      if(inp.value===''){
        delete RESULTS.ko[legId][inp.dataset.side];
        if(RESULTS.ko[legId].h===undefined && RESULTS.ko[legId].a===undefined) delete RESULTS.ko[legId];
      } else {
        RESULTS.ko[legId][inp.dataset.side] = inp.value;
      }
    });
  });
}

/* ============ UTILIDADES ============ */
function escapeHtml(s){
  return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showToast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.toggle('err', !!isErr); t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

/* ============ INIT ============ */
(async function init(){
  await loadAll();
  renderTab('liga');
})();
</script>
