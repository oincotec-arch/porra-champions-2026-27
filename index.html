<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Porra Champions League 2026/27</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1117">
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2129; --border:#2a313c;
    --orange:#ff8a3d; --orange2:#ffb35c; --text:#e6edf3; --muted:#8b949e;
    --green:#3fb950; --red:#f85149; --gold:#ffd166;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);padding-bottom:70px;}
  header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#12161d,#0d1117);border-bottom:1px solid var(--border);padding:14px 16px 10px;}
  header h1{margin:0;font-size:1.1rem;display:flex;align-items:center;gap:8px;}
  header h1 .logo{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,var(--orange),var(--orange2));display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#1a1200;font-size:.8rem;}
  header .sub{color:var(--muted);font-size:.75rem;margin-top:2px;}
  nav{display:flex;gap:6px;position:sticky;top:56px;z-index:19;background:var(--bg);padding:8px 10px;border-bottom:1px solid var(--border);overflow-x:auto;}
  nav button{flex:1;white-space:nowrap;background:transparent;border:1px solid var(--border);color:var(--muted);padding:9px 10px;border-radius:10px;font-size:.82rem;font-weight:600;cursor:pointer;}
  nav button.active{background:var(--orange);color:#1a1200;border-color:var(--orange);}
  main{padding:14px;max-width:760px;margin:0 auto;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;}
  .muted{color:var(--muted);}
  h2{font-size:1rem;margin:0 0 10px;color:var(--orange2);}
  h3{font-size:.88rem;margin:16px 0 8px;color:var(--text);border-top:1px solid var(--border);padding-top:12px;}
  select,input[type=text],input[type=number]{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-size:.9rem;width:100%;}
  .row{display:flex;gap:8px;align-items:center;}
  .btn{background:var(--orange);color:#1a1200;border:none;border-radius:10px;padding:11px 16px;font-weight:700;font-size:.9rem;cursor:pointer;}
  .btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border);}
  .btn:disabled{opacity:.5;}
  table{width:100%;border-collapse:collapse;font-size:.85rem;}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .table-scroll table{white-space:nowrap;}
  th,td{text-align:left;padding:7px 5px;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.03em;}
  tr.me{background:rgba(255,138,61,.08);}
  .pos{width:14px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .pos.medal-1{color:var(--gold);font-weight:800;}
  .pos.medal-2{color:#d9d9d9;font-weight:800;}
  .pos.medal-3{color:#cd8a4e;font-weight:800;}
  .pts{font-weight:800;color:var(--orange2);text-align:right;}
  .num{text-align:center;width:24px;}
  .rk-name{display:inline-block;max-width:110px;white-space:normal;word-break:break-word;line-height:1.15;vertical-align:middle;}
  .table-scroll th:last-child,.table-scroll td:last-child{position:sticky;right:0;background:var(--panel);box-shadow:-6px 0 6px -6px rgba(0,0,0,.5);}
  @media (max-width:420px){
    th,td{padding:6px 3px;}
    th{font-size:.6rem;}
    table{font-size:.74rem;}
    .rk-name{max-width:78px;}
    .pos{width:12px;}
    .num{width:20px;}
  }
  .jornada-title{font-weight:700;margin:14px 0 8px;color:var(--orange2);font-size:.9rem;}
  .match-row{display:grid;grid-template-columns:1fr 46px 46px 1fr;gap:6px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--border);font-size:.85rem;}
  .match-row input{width:100%;text-align:center;padding:6px 2px;}
  .match-row .score{display:flex;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:6px 2px;font-weight:700;color:var(--text);}
  .match-row .team{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .match-row .team.home{text-align:right;}
  .match-meta{font-size:.7rem;color:var(--muted);text-align:center;margin-bottom:2px;}
  .result-badge{font-size:.72rem;padding:2px 6px;border-radius:6px;background:var(--panel2);color:var(--muted);}
  .result-badge.exact{background:rgba(63,185,80,.18);color:var(--green);}
  .result-badge.diff{background:rgba(255,209,102,.18);color:var(--gold);}
  .result-badge.sign{background:rgba(255,138,61,.18);color:var(--orange2);}
  .top8-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .team-chip{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:.83rem;cursor:pointer;}
  .team-chip input{width:auto;}
  .team-chip.checked{border-color:var(--orange);background:rgba(255,138,61,.1);}
  .counter{font-size:.78rem;color:var(--muted);margin-top:6px;}
  .tag{display:inline-block;font-size:.68rem;padding:2px 7px;border-radius:20px;background:var(--panel2);color:var(--muted);margin-left:6px;}
  .save-bar{position:fixed;left:0;right:0;bottom:0;background:#12161d;border-top:1px solid var(--border);padding:10px 14px;display:flex;gap:10px;justify-content:center;z-index:30;}
  .save-bar .btn{flex:1;max-width:420px;}
  .toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:var(--green);color:#06210b;padding:9px 16px;border-radius:10px;font-weight:700;font-size:.85rem;z-index:40;opacity:0;transition:opacity .3s;pointer-events:none;}
  .toast.show{opacity:1;}
  .empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:.9rem;}
  .bonus-grid{display:grid;grid-template-columns:1fr;gap:10px;}
  label.field-label{font-size:.78rem;color:var(--muted);margin-bottom:4px;display:block;}
  .ko-section{opacity:.55;}
  .ko-section.unlocked{opacity:1;}
</style>
</head>

   sorteo/resultado correspondiente es conocido. Mientras tanto se
   muestran como "Por determinar". Esto es lo mismo que el mecanismo
   koLocked de la porra del Mundial, adaptado a ida y vuelta. */

// Cada eliminatoria a doble partido genera dos partidos individuales (ida/vuelta),
// cada uno puntuable con la tabla estándar (+3/+2/+1). La Final es partido único.
function koLegIds(tieId){
  if(tieId==='FINAL') return [{id:'FINAL', label:'Final única'}];
  return [{id:tieId+'_ida', label:'Ida'}, {id:tieId+'_vuelta', label:'Vuelta'}];
}

// Antes de "enviada" toda porra guardada es un borrador (no cuenta para ranking/predicciones).
// Las porras guardadas antes de que existiera este campo se tratan como enviadas,
// para no hacerlas desaparecer retroactivamente.
// Con el envío por fases (enviadaHasta), cuenta como enviada en cuanto se ha
// confirmado al menos la primera tanda de jornadas.
function isSubmitted(p){
  if(!p) return false;
  if(p.enviada) return true;
  if(p.enviadaHasta) return p.enviadaHasta > 0;
  return p.enviada !== false;
}

// Jornada máxima abierta para rellenar (la controla el admin). Por defecto, 2.
function getOpenLimit(){
  let n = RESULTS && RESULTS.jornadaAbierta;
  if(n==null) n = 2;
  n = Number(n);
  if(isNaN(n) || n<1) n = 1;
  if(n>8) n = 8;
  return n;
}

/* ============ NORMALIZACIÓN DE TEXTO (evita el bug de acentos del Mundial) ============ */
function norm(s){
  return (s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
}

/* ============ PUNTUACIÓN ============ */
function sign(h,a){ return h>a?'1':(h===a?'X':'2'); }

function matchPoints(pred, real){
  if(!pred || real==null || real.h==null || real.a==null || pred.h===''||pred.h==null||pred.a===''||pred.a==null) return {pts:0,tag:''};
  const ph=Number(pred.h), pa=Number(pred.a), rh=Number(real.h), ra=Number(real.a);
  if(isNaN(ph)||isNaN(pa)) return {pts:0,tag:''};
  if(ph===rh && pa===ra) return {pts:3,tag:'exact'};
  const sameSign = sign(ph,pa)===sign(rh,ra);
  const sameDiff = (ph-pa)===(rh-ra);
  if(sameSign && sameDiff) return {pts:2,tag:'diff'};
  if(sameSign) return {pts:1,tag:'sign'};
  return {pts:0,tag:''};
}

function calcPts(p){
  let pts=0;
  const breakdown={liga:0, top8:0, ko:0, bonus:0};
  // Fase de liga
  MATCHES.forEach(m=>{
    const real = RESULTS.matches[m.id];
    const pred = p.matches && p.matches[m.id];
    if(real){ const r=matchPoints(pred,real); pts+=r.pts; breakdown.liga+=r.pts; }
  });
  // Eliminatorias (cada pierna cuenta igual que un partido de liga)
  KO.forEach(tieDef=>{
    koLegIds(tieDef.id).forEach(leg=>{
      const real = RESULTS.ko[leg.id];
      const pred = p.ko && p.ko[leg.id];
      if(real){ const r=matchPoints(pred,real); pts+=r.pts; breakdown.ko+=r.pts; }
    });
  });
  // Bonus Top 8 (+4 por equipo acertado en el top 8 real, tras la jornada 8)
  if(RESULTS.top8Actual && RESULTS.top8Actual.length===8 && p.top8){
    const actualSet = new Set(RESULTS.top8Actual.map(norm));
    let hits=0;
    p.top8.forEach(t=>{ if(t && actualSet.has(norm(t))) hits++; });
    pts += hits*4; breakdown.top8 = hits*4;
  }
  // Bonus finales
  let bonus=0;
  if(RESULTS.champion && p.champion && norm(p.champion)===norm(RESULTS.champion)) bonus+=10;
  if(RESULTS.runnerUp && p.runnerUp && norm(p.runnerUp)===norm(RESULTS.runnerUp)) bonus+=6;
  if(RESULTS.leagueLeader && p.leagueLeader && norm(p.leagueLeader)===norm(RESULTS.leagueLeader)) bonus+=4;
  if(RESULTS.scorer && p.scorer && norm(p.scorer).includes(norm(RESULTS.scorer).split(' ')[0])) bonus+=3;
  pts += bonus; breakdown.bonus = bonus;
  return {total:pts, breakdown};
}

/* ============ API (Apps Script) ============ */
async function apiCall(action, payload){
  if(!API_URL || API_URL.indexOf('PON_AQUI')===0){
    console.warn('API_URL no configurada todavía — modo local/demo.');
    return {ok:false, demo:true};
  }
  try{
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action, payload})
    });
    return await res.json();
  }catch(e){
    console.error(e);
    return {ok:false, error:String(e)};
  }
}

      draft = JSON.parse(JSON.stringify(existing));
    } else if(local && (!currentUserId || local.id===currentUserId)){
      // No llegó a sincronizarse con el backend (ej. sin conexión) pero quedó guardada en este dispositivo.
      draft = local;
      currentUserId = draft.id || currentUserId;

    if(j>openLimit) tag = ' <span class="tag">🔒 aún no abierta</span>';
    else if(j<=sentUpTo) tag = ' <span class="tag">✅ enviada</span>';
    html += `<div class="jornada-title">Jornada ${j}${tag}</div>`;
    const jDis = fullLocked || j<=sentUpTo || j>openLimit;
    MATCHES.filter(m=>m.j===j).forEach(m=>{
      const pred = draft.matches[m.id] || {};
      html += `<div class="match-row">
        <div class="team home">${escapeHtml(m.h)}</div>
        <input type="number" min="0" max="20" ${jDis?'disabled':''} data-mid="${m.id}" data-side="h" value="${pred.h!=null?pred.h:''}">
        <input type="number" min="0" max="20" ${jDis?'disabled':''} data-mid="${m.id}" data-side="a" value="${pred.a!=null?pred.a:''}">
        <div class="team">${escapeHtml(m.a)}</div>
      </div>`;
    });
  }
  html += '</div>';

  html += '<div class="card"><h2>Eliminatorias</h2><p class="muted" style="font-size:.8rem">Se activan aquí en cuanto se conozcan los cruces de cada ronda.</p>';
  KO.forEach(tie=>{
    if(!tie.unlocked) return;
    html += `<div class="match-meta"><b>${tie.stage}:</b> ${escapeHtml(tie.home)} vs ${escapeHtml(tie.away)}</div>`;
    koLegIds(tie.id).forEach(leg=>{
      const pred = draft.ko[leg.id] || {};
      html += `<div class="match-row">
        <div class="team home">${escapeHtml(tie.home)}</div>
        <input type="number" min="0" max="20" ${koDis} data-koid="${leg.id}" data-side="h" value="${pred.h!=null?pred.h:''}">
        <input type="number" min="0" max="20" ${koDis} data-koid="${leg.id}" data-side="a" value="${pred.a!=null?pred.a:''}">
        <div class="team">${escapeHtml(tie.away)} <span class="tag">${leg.label}</span></div>
      </div>`;
    });
  });
  const anyUnlocked = KO.some(t=>t.unlocked);
  if(!anyUnlocked) html += '<div class="empty">Aún no hay ninguna eliminatoria desbloqueada.</div>';
  html += '</div>';

  if(fullLocked){
    html += `<div class="save-bar"><span class="muted">🔒 Porra enviada definitivamente — ya no se puede modificar</span></div>`;
  } else {
    html += '<div class="save-bar">';
    html += '<button class="btn secondary" id="saveDraftBtn">💾 Guardar borrador</button>';
    if(sentUpTo < openLimit){
      const label = (sentUpTo+1===openLimit) ? `Jornada ${openLimit}` : `Jornadas ${sentUpTo+1}–${openLimit}`;
      html += `<button class="btn" id="sendPhaseBtn">✅ Enviar ${label} (definitivo)</button>`;
    }
    if(sentUpTo>=8){
      html += `<button class="btn" id="sendFinalBtn">🏁 Enviar porra COMPLETA definitiva</button>`;
    }
    html += '</div>';
  }

  el.innerHTML = html;

  if(!fullLocked){
    document.querySelectorAll('#tab-miporra input[type=number]').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        if(inp.dataset.mid){
          const mm = MATCHES.find(x=>x.id===inp.dataset.mid);
          if(mm && mm.j<=(draft.enviadaHasta||0)) return; // esa jornada ya se envió: bloqueada
          draft.matches[inp.dataset.mid] = draft.matches[inp.dataset.mid] || {};
          draft.matches[inp.dataset.mid][inp.dataset.side] = inp.value;
        } else if(inp.dataset.koid){
          draft.ko[inp.dataset.koid] = draft.ko[inp.dataset.koid] || {};
          draft.ko[inp.dataset.koid][inp.dataset.side] = inp.value;
        }
        scheduleAutosave();
      });
    });
    const bonusInp = id=>{
      const inp = document.getElementById(id);
      if(!inp) return;
      const handler = ()=>{ if((draft.enviadaHasta||0)>0) return; scheduleAutosave(); };
      inp.addEventListener('input', handler);
      inp.addEventListener('change', handler);
    };
    ['fChampion','fRunnerUp','fLeader','fScorer'].forEach(bonusInp);
    const nameInp = document.getElementById('fName');
    if(nameInp){ nameInp.addEventListener('input', scheduleAutosave); nameInp.addEventListener('change', scheduleAutosave); }
    const saveDraftBtn = document.getElementById('saveDraftBtn');
    if(saveDraftBtn) saveDraftBtn.addEventListener('click', ()=>doSave('draft'));
    const sendPhaseBtn = document.getElementById('sendPhaseBtn');
    if(sendPhaseBtn) sendPhaseBtn.addEventListener('click', ()=>doSave('phase'));
    const sendFinalBtn = document.getElementById('sendFinalBtn');
    if(sendFinalBtn) sendFinalBtn.addEventListener('click', ()=>doSave('final'));
  }
  updateTop8Counter();
  updateSaveStatus();
}

function teamSelect(id, value, disabled){
  let html = `<select id="${id}" ${disabled?'disabled':''}><option value="">-- elegir equipo --</option>`;
  TEAMS.forEach(t=>{ html += `<option value="${escapeHtml(t)}" ${t===value?'selected':''}>${escapeHtml(t)}</option>`; });
  html += '</select>';
  return html;
}

function toggleTop8(cb){
  if(draft && (draft.enviada || (draft.enviadaHasta||0)>0)) return; // bonus ya enviado: bloqueado
  draft.top8 = draft.top8 || [];
  if(cb.checked){
    if(draft.top8.length>=8){ cb.checked=false; showToast('Máximo 8 equipos'); return; }
    draft.top8.push(cb.value);
  } else {
    draft.top8 = draft.top8.filter(t=>t!==cb.value);
  }
  cb.closest('.team-chip').classList.toggle('checked', cb.checked);
  updateTop8Counter();
  scheduleAutosave();
}
function updateTop8Counter(){
  const c = document.getElementById('top8Counter');
  if(c) c.textContent = `${(draft.top8||[]).length} / 8 seleccionados`;
}

let autosaveTimer = null;

function scheduleAutosave(){
  if(!draft || draft.enviada) return; // porra ya enviada del todo: bloqueada, no se admiten más cambios
  clearTimeout(autosaveTimer);
  updateSaveStatus('editing');
  autosaveTimer = setTimeout(()=>{ doSave('draft', {silent:true}); }, 1500);
}

function countFilledMatches(){
  return MATCHES.filter(m=>{
    const pr = draft.matches[m.id];
    return pr && pr.h!=='' && pr.h!=null && pr.a!=='' && pr.a!=null;
  }).length;
}

function updateSaveStatus(state){
  const el = document.getElementById('miPorraStatusText');
  if(!el || !draft) return;
  const totalTxt = `${countFilledMatches()}/${MATCHES.length} partidos rellenados`;
  const openLimit = getOpenLimit();
  const sentUpTo = draft.enviadaHasta || 0;
  let stateTxt;
  if(draft.enviada){
    stateTxt = '✅ Porra enviada definitivamente — bloqueada, ya no se puede modificar';
  } else if(state==='saving'){
    stateTxt = '💾 Guardando…';
  } else if(state==='editing'){
    stateTxt = '✏️ Editando… se guardará solo en unos segundos';
  } else if(state==='offline'){
    stateTxt = '⚠️ Sin conexión con el servidor — de momento guardada solo en este dispositivo';
  } else if(sentUpTo>=openLimit && sentUpTo>0 && openLimit<8){
    stateTxt = `✅ Enviado hasta la Jornada ${sentUpTo}. Iremos abriendo el resto según avance la fase de liga.`;
  } else if(sentUpTo>=8){
    stateTxt = '✅ Fase de liga enviada completa (hasta la Jornada 8). Podrás rellenar las eliminatorias cuando se desbloqueen.';
  } else {
    stateTxt = `📝 Borrador — se guarda automáticamente. Rellena hasta la Jornada ${openLimit} y pulsa "Enviar" cuando esté lista.`;
  }
  el.textContent = `${stateTxt} · ${totalTxt}`;
}

async function doSave(mode, opts){
  // mode: 'draft' (solo guarda), 'phase' (confirma la tanda de jornadas abierta), 'final' (bloqueo total)
  opts = opts || {};
  if(!draft) return;
  if(draft.enviada){
    // Ya se envió definitivamente: bloqueada, ningún guardado (ni manual ni autoguardado) puede modificarla.
    if(!opts.silent) showToast('Esta porra ya está enviada y no se puede modificar');
    return;
  }
  const nameEl = document.getElementById('fName'); if(nameEl) draft.alias = nameEl.value.trim();
  draft.name = draft.alias;
  if((draft.enviadaHasta||0)===0){
    const champEl = document.getElementById('fChampion'); if(champEl) draft.champion = champEl.value;
    const runEl = document.getElementById('fRunnerUp'); if(runEl) draft.runnerUp = runEl.value;
    const leadEl = document.getElementById('fLeader'); if(leadEl) draft.leagueLeader = leadEl.value;
    const scorerEl = document.getElementById('fScorer'); if(scorerEl) draft.scorer = scorerEl.value.trim();
  }

  if(!draft.alias){
    if(!opts.silent) showToast('Ponle un nombre a tu porra');
    return;
  }
  if(!draft.id) draft.id = 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
  currentUserId = draft.id;
  localStorage_set('ccl_uid', currentUserId);

  if(mode==='phase') draft.enviadaHasta = getOpenLimit();
  if(mode==='final') draft.enviada = true;

  saveLocalDraft(draft);
  updateSaveStatus('saving');

  const res = await savePorra(draft);
  const idx = PARTICIPANTS.findIndex(p=>p.id===draft.id);
  if(idx>=0) PARTICIPANTS[idx] = draft; else PARTICIPANTS.push(draft);

  if(res && res.ok){
    updateSaveStatus();
    if(!opts.silent){
      const msg = mode==='final' ? 'Porra enviada ✔' : (mode==='phase' ? 'Jornadas enviadas ✔' : 'Borrador guardado ✔');
      showToast(msg);
    }
  } else {
    updateSaveStatus('offline');
    if(!opts.silent) showToast('Guardado localmente (revisa la conexión con la API)');
  }
  return res;
}

/* ============ UTILIDADES ============ */
function escapeHtml(s){
  return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('es-ES',{day:'2-digit',month:'short'});
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ============ INIT ============ */
(async function init(){
  await loadAll();
  renderTab('ranking');
})();
</script>
